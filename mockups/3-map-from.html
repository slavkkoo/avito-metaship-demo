<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пункт отправления</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #e8e4df;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            color: #000;
            overflow: hidden;
        }

        /* Map Container - Yandex Maps style */
        .map-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: #f0ede8;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 932" preserveAspectRatio="xMidYMid slice">\
                <!-- Base background -->\
                <rect fill="%23f0ede8" width="430" height="932"/>\
                \
                <!-- Parks / Green areas -->\
                <ellipse cx="50" cy="200" rx="80" ry="60" fill="%23c8e6c9" opacity="0.7"/>\
                <ellipse cx="380" cy="350" rx="90" ry="70" fill="%23c8e6c9" opacity="0.6"/>\
                <rect x="0" y="600" width="120" height="100" fill="%23c8e6c9" opacity="0.5" rx="20"/>\
                <ellipse cx="200" cy="150" rx="40" ry="30" fill="%23c8e6c9" opacity="0.5"/>\
                \
                <!-- River / Water -->\
                <path d="M-20 700 Q100 650, 180 680 Q280 720, 350 690 Q400 670, 450 700 L450 800 L-20 800 Z" fill="%23a8d4e6" opacity="0.6"/>\
                \
                <!-- Buildings / Blocks -->\
                <rect x="80" y="100" width="60" height="45" fill="%23e0ddd8" rx="3"/>\
                <rect x="160" y="85" width="80" height="55" fill="%23dddad5" rx="3"/>\
                <rect x="260" y="110" width="55" height="40" fill="%23e0ddd8" rx="3"/>\
                <rect x="340" y="80" width="70" height="50" fill="%23dddad5" rx="3"/>\
                \
                <rect x="30" y="250" width="90" height="60" fill="%23dddad5" rx="3"/>\
                <rect x="150" y="230" width="70" height="50" fill="%23e0ddd8" rx="3"/>\
                <rect x="250" y="250" width="85" height="55" fill="%23dddad5" rx="3"/>\
                \
                <rect x="60" y="380" width="100" height="70" fill="%23e0ddd8" rx="3"/>\
                <rect x="190" y="360" width="75" height="60" fill="%23dddad5" rx="3"/>\
                <rect x="300" y="390" width="90" height="65" fill="%23e0ddd8" rx="3"/>\
                \
                <rect x="20" y="500" width="80" height="55" fill="%23dddad5" rx="3"/>\
                <rect x="130" y="480" width="95" height="70" fill="%23e0ddd8" rx="3"/>\
                <rect x="260" y="510" width="70" height="50" fill="%23dddad5" rx="3"/>\
                <rect x="350" y="490" width="60" height="60" fill="%23e0ddd8" rx="3"/>\
                \
                <!-- Main roads - white -->\
                <path d="M0 200 L180 200 Q200 200, 200 220 L200 400" stroke="%23ffffff" stroke-width="12" fill="none"/>\
                <path d="M200 400 Q200 420, 220 420 L430 420" stroke="%23ffffff" stroke-width="12" fill="none"/>\
                <path d="M100 0 L100 180 Q100 200, 120 200" stroke="%23ffffff" stroke-width="10" fill="none"/>\
                <path d="M320 0 L320 400 Q320 420, 340 420" stroke="%23ffffff" stroke-width="10" fill="none"/>\
                \
                <!-- Secondary roads -->\
                <path d="M0 350 L150 350" stroke="%23ffffff" stroke-width="7" fill="none"/>\
                <path d="M250 350 L430 350" stroke="%23ffffff" stroke-width="7" fill="none"/>\
                <path d="M0 550 L200 550 Q220 550, 220 570 L220 650" stroke="%23ffffff" stroke-width="7" fill="none"/>\
                <path d="M280 550 L430 550" stroke="%23ffffff" stroke-width="7" fill="none"/>\
                \
                <!-- Street labels style lines -->\
                <path d="M50 300 L130 300" stroke="%23d0cdc8" stroke-width="1" fill="none"/>\
                <path d="M280 300 L360 300" stroke="%23d0cdc8" stroke-width="1" fill="none"/>\
                <path d="M150 450 L230 450" stroke="%23d0cdc8" stroke-width="1" fill="none"/>\
                \
                <!-- Metro stations -->\
                <circle cx="200" cy="200" r="8" fill="%23e53935"/>\
                <circle cx="320" cy="350" r="8" fill="%23e53935"/>\
                <circle cx="100" cy="420" r="8" fill="%23e53935"/>\
            </svg>');
            background-size: cover;
            background-position: center;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 50px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .search-btn {
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .search-btn svg {
            width: 22px;
            height: 22px;
            fill: #000;
        }

        /* Map Markers */
        .marker {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 8px 8px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 5;
        }

        .marker:hover {
            transform: scale(1.05);
        }

        .marker.selected {
            background: #000;
            color: #fff;
        }

        .marker-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 700;
            color: #fff;
        }

        .marker-logo.cdek {
            background: #00b33c;
        }

        .marker-logo.yandex {
            background: #fc3f1d;
        }

        .marker-logo.pochta {
            background: #003399;
        }

        .marker-info {
            display: flex;
            flex-direction: column;
        }

        .marker-name {
            font-size: 14px;
            font-weight: 600;
        }

        .marker-price {
            font-size: 12px;
            opacity: 0.7;
        }

        .marker.selected .marker-name,
        .marker.selected .marker-price {
            color: #fff;
        }

        /* Location Button */
        .location-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 10;
        }

        .location-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* List Button */
        .list-btn {
            position: absolute;
            left: 16px;
            bottom: 320px;
            padding: 10px 16px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 10;
            font-size: 14px;
            font-weight: 500;
        }

        .list-btn svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }

        /* Bottom Panel */
        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 20;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }

        .panel-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 500;
            color: #8e8e93;
        }

        /* Address Input */
        .address-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #f5f5f5;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .address-text {
            flex: 1;
            font-size: 16px;
            color: #000;
        }

        .clear-btn {
            width: 20px;
            height: 20px;
            background: #c7c7cc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .clear-btn svg {
            width: 12px;
            height: 12px;
            fill: #fff;
        }

        /* Selected PVZ Info */
        .pvz-info {
            margin-bottom: 16px;
        }

        .pvz-name {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-bottom: 4px;
        }

        .pvz-address {
            font-size: 15px;
            color: #000;
            margin-bottom: 4px;
        }

        .pvz-hours {
            font-size: 14px;
            color: #8e8e93;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #f5f5f5;
            color: #8e8e93;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: all 0.2s;
        }

        .submit-btn.active {
            background: #000;
            color: #fff;
        }

        .submit-btn.active:hover {
            opacity: 0.85;
        }

        /* Hint */
        .hint {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin-top: 12px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div class="map-container">
        <!-- Markers -->
        <div class="marker" style="top: 22%; left: 15%;" onclick="selectMarker(this, 'cdek')">
            <div class="marker-logo cdek">СДЭК</div>
            <div class="marker-info">
                <span class="marker-name">СДЭК</span>
                <span class="marker-price">49 ₽, 2-3 дня</span>
            </div>
        </div>

        <div class="marker" style="top: 35%; left: 25%;" onclick="selectMarker(this, 'yandex')">
            <div class="marker-logo yandex">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
            </div>
            <div class="marker-info">
                <span class="marker-name">Яндекс</span>
                <span class="marker-price">49 ₽, 2-3 дня</span>
            </div>
        </div>

        <div class="marker selected" style="top: 52%; left: 45%;" onclick="selectMarker(this, 'pochta')">
            <div class="marker-logo pochta">
                <span style="font-size: 6px; line-height: 1;">ПОЧТА<br>РОССИИ</span>
            </div>
            <div class="marker-info">
                <span class="marker-name">Почта России</span>
                <span class="marker-price">49 ₽, 2-3 дня</span>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="2-address-input.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <span class="header-title">Пункт отправления</span>
        <div class="search-btn">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
    </div>

    <!-- Location Button -->
    <div class="location-btn">
        <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </div>

    <!-- List Button -->
    <div class="list-btn">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>Список</span>
    </div>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
        <div class="panel-header">
            <span class="panel-title">Адрес</span>
        </div>

        <div class="address-row">
            <span class="address-text">Москва, Тверская 5</span>
            <div class="clear-btn">
                <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </div>
        </div>

        <div class="pvz-info">
            <div class="pvz-name">Почта России</div>
            <div class="pvz-address">Москва, ул. Лесная, 5</div>
            <div class="pvz-hours">Пн-пт: 8:00-21:00<br>Сб-вс: 9:00-18:00</div>
        </div>

        <a href="4-sender.html" class="submit-btn active">Отправить отсюда</a>
    </div>

    <script>
        function selectMarker(el, type) {
            document.querySelectorAll('.marker').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');

            const names = {
                cdek: 'СДЭК',
                yandex: 'Яндекс',
                pochta: 'Почта России'
            };

            document.querySelector('.pvz-name').textContent = names[type];
        }
    </script>
</body>
</html>
