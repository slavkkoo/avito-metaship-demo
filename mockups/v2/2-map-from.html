<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пункт отправления</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-frame {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background: #fff;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Header */
        .header {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f2f2f2;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #141414;
        }

        .header-title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            color: #141414;
            text-align: center;
        }

        .search-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .search-btn svg {
            width: 24px;
            height: 24px;
            fill: #141414;
        }

        /* Map */
        .map-container {
            height: calc(100vh - 200px);
            height: calc(100dvh - 200px);
            background: #e8e8e8;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="%23e8e8e8" width="100" height="100"/><path d="M0 50h100M50 0v100" stroke="%23d0d0d0" stroke-width="0.5"/></svg>');
            position: relative;
            overflow: hidden;
        }

        /* User Location */
        .user-location {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #007aff;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,122,255,0.4);
            top: 40%;
            left: 30%;
        }

        .user-location-2 {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #007aff;
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,122,255,0.4);
            top: 35%;
            right: 25%;
        }

        /* PVZ Cards */
        .pvz-cards {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pvz-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
        }

        .pvz-card:hover {
            transform: scale(1.02);
        }

        .pvz-card-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .pvz-card-logo.cdek {
            background: #00b33c;
        }

        .pvz-card-logo.yandex {
            background: #fc0;
        }

        .pvz-card-logo svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .pvz-card-logo.yandex svg {
            fill: #000;
        }

        .pvz-card-info {
            flex: 1;
        }

        .pvz-card-name {
            font-size: 16px;
            font-weight: 600;
            color: #141414;
        }

        .pvz-card-details {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 2px;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .phone-frame {
                max-width: 430px;
                margin: 20px auto;
                border-radius: 40px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.15);
                overflow: hidden;
                min-height: calc(100vh - 40px);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 4h2v8H1V4zm4-2h2v10H5V2zm4-2h2v12H9V0zm4 4h2v8h-2V4zm4-2h2v10h-2V2z" fill="#141414"/></svg>
                <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.5c2.7 0 5.2 1 7.1 2.7l-1.4 1.4c-1.5-1.3-3.5-2.1-5.7-2.1s-4.2.8-5.7 2.1L1.4 5.2c1.9-1.7 4.4-2.7 7.1-2.7z" fill="#141414"/></svg>
                <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#141414" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#141414"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#141414"/></svg>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <a href="1-main.html" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </a>
            <div class="header-title">Пункт отправления</div>
            <a href="3-pvz-list.html" class="search-btn">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
        </div>

        <!-- Map -->
        <div class="map-container">
            <!-- User Location markers -->
            <div class="user-location"></div>
            <div class="user-location-2"></div>

            <!-- PVZ Cards -->
            <div class="pvz-cards">
                <a href="4-sender.html" class="pvz-card">
                    <div class="pvz-card-logo cdek">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                    </div>
                    <div class="pvz-card-info">
                        <div class="pvz-card-name">СДЭК</div>
                        <div class="pvz-card-details">49 ₽, 2–3 дня</div>
                    </div>
                </a>

                <a href="4-sender.html" class="pvz-card">
                    <div class="pvz-card-logo yandex">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.94-.49-7-3.85-7-7.93s3.06-7.44 7-7.93v15.86zm2 0V4.07c3.94.49 7 3.85 7 7.93s-3.06 7.44-7 7.93z"/></svg>
                    </div>
                    <div class="pvz-card-info">
                        <div class="pvz-card-name">Яндекс</div>
                        <div class="pvz-card-details">49 ₽, 2–3 дня</div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
