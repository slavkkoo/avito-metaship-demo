<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто получит посылку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f2f2f2;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Header */
        .header {
            background: #fff;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #f2f2f2;
        }

        .back-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #141414;
        }

        .header-title {
            flex: 1;
            font-size: 17px;
            font-weight: 600;
            color: #141414;
        }

        /* PVZ Info */
        .pvz-info-card {
            background: #fff;
            margin: 12px;
            border-radius: 16px;
            padding: 16px 20px;
        }

        .pvz-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .pvz-logo {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #0055a5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pvz-logo svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        .pvz-details {
            flex: 1;
        }

        .pvz-name {
            font-size: 16px;
            font-weight: 600;
            color: #141414;
        }

        .pvz-address {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 2px;
        }

        .change-btn {
            font-size: 14px;
            color: #00aaff;
            cursor: pointer;
            text-decoration: none;
        }

        .pvz-meta {
            display: flex;
            gap: 16px;
            padding-top: 12px;
            border-top: 1px solid #f2f2f2;
        }

        .pvz-meta-item {
            font-size: 13px;
            color: #8e8e93;
        }

        /* Form */
        .form-card {
            background: #fff;
            margin: 12px;
            border-radius: 16px;
            padding: 20px;
        }

        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #141414;
            margin-bottom: 16px;
        }

        .form-field {
            margin-bottom: 16px;
        }

        .form-field:last-child {
            margin-bottom: 0;
        }

        .form-label {
            font-size: 13px;
            color: #8e8e93;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 50px;
            background: #f7f7f7;
            border: none;
            border-radius: 12px;
            padding: 0 16px;
            font-size: 16px;
            color: #141414;
            outline: none;
            transition: background 0.2s;
        }

        .form-input:focus {
            background: #f0f0f0;
        }

        .form-input::placeholder {
            color: #c7c7cc;
        }

        .phone-input {
            display: flex;
            align-items: center;
            background: #f7f7f7;
            border-radius: 12px;
            padding: 0 16px;
            height: 50px;
        }

        .phone-prefix {
            font-size: 16px;
            color: #141414;
            margin-right: 4px;
        }

        .phone-input input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            color: #141414;
            outline: none;
        }

        /* Bottom Bar */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #fff;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            box-shadow: 0 -2px 20px rgba(0,0,0,0.08);
            z-index: 100;
        }

        .submit-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #141414 0%, #2d2d2d 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #2d2d2d 0%, #3d3d3d 100%);
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 4h2v8H1V4zm4-2h2v10H5V2zm4-2h2v12H9V0zm4 4h2v8h-2V4zm4-2h2v10h-2V2z" fill="#141414"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.5c2.7 0 5.2 1 7.1 2.7l-1.4 1.4c-1.5-1.3-3.5-2.1-5.7-2.1s-4.2.8-5.7 2.1L1.4 5.2c1.9-1.7 4.4-2.7 7.1-2.7z" fill="#141414"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#141414" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#141414"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#141414"/></svg>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="2-map-to.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <div class="header-title">Кто получит посылку</div>
    </div>

    <!-- PVZ Info -->
    <div class="pvz-info-card">
        <div class="pvz-header">
            <div class="pvz-logo">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
            </div>
            <div class="pvz-details">
                <div class="pvz-name">Почта России</div>
                <div class="pvz-address">СПб, ул. Кораблестроителей, 21</div>
            </div>
            <a href="2-map-to.html" class="change-btn">Изменить</a>
        </div>
        <div class="pvz-meta">
            <span class="pvz-meta-item">Пн-Пт: 9:00-20:00</span>
            <span class="pvz-meta-item">Сб-Вс: 10:00-18:00</span>
        </div>
    </div>

    <!-- Form -->
    <div class="form-card">
        <div class="form-hint" style="font-size: 14px; color: #8e8e93; margin-bottom: 20px; line-height: 1.4;">
            Указывайте реальные данные — сотрудник ПВЗ может проверить паспорт
        </div>

        <div class="form-field">
            <div class="form-label">ФИО</div>
            <input type="text" class="form-input" placeholder="Фамилия Имя Отчество" value="Сидорова Анна Петровна">
        </div>

        <div class="form-field">
            <div class="form-label">Телефон</div>
            <div class="phone-input">
                <span class="phone-prefix">+7</span>
                <input type="tel" placeholder="(999) 123-45-67" value="(921) 987-65-43">
            </div>
        </div>

        <div class="form-field">
            <div class="form-label">Электронная почта</div>
            <input type="email" class="form-input" placeholder="email@example.com" value="">
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <a href="1-main-filled.html" class="submit-btn">Сохранить</a>
    </div>
</body>
</html>
