<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заказ создан</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #fff;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
        }

        .status-icons {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .close-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            fill: #141414;
        }

        /* Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #4caf50 0%, #43a047 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .success-icon svg {
            width: 40px;
            height: 40px;
            fill: #fff;
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            color: #141414;
            margin-bottom: 12px;
        }

        .success-desc {
            font-size: 16px;
            color: #8e8e93;
            line-height: 1.5;
            max-width: 300px;
        }

        /* Order Info Card */
        .order-card {
            width: 100%;
            background: #f7f7f7;
            border-radius: 16px;
            padding: 20px;
            margin-top: 32px;
            text-align: left;
        }

        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .order-row:last-child {
            margin-bottom: 0;
        }

        .order-label {
            font-size: 15px;
            color: #8e8e93;
        }

        .order-value {
            font-size: 15px;
            color: #141414;
            font-weight: 500;
        }

        /* Bottom Bar */
        .bottom-bar {
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .primary-btn {
            width: 100%;
            height: 56px;
            background: linear-gradient(135deg, #141414 0%, #2d2d2d 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .secondary-btn {
            width: 100%;
            height: 56px;
            background: #f7f7f7;
            color: #141414;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 4h2v8H1V4zm4-2h2v10H5V2zm4-2h2v12H9V0zm4 4h2v8h-2V4zm4-2h2v10h-2V2z" fill="#141414"/></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.5c2.7 0 5.2 1 7.1 2.7l-1.4 1.4c-1.5-1.3-3.5-2.1-5.7-2.1s-4.2.8-5.7 2.1L1.4 5.2c1.9-1.7 4.4-2.7 7.1-2.7z" fill="#141414"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#141414" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#141414"/><rect x="2" y="3" width="14" height="6" rx="1" fill="#141414"/></svg>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="1-main.html" class="close-btn">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </a>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div class="success-title">Заказ создан</div>
        <div class="success-desc">
            Принесите посылку в ПВЗ Почты России до 20 мая. Оплата при получении.
        </div>

        <div class="order-card">
            <div class="order-row">
                <span class="order-label">Номер заказа</span>
                <span class="order-value">MS-847291</span>
            </div>
            <div class="order-row">
                <span class="order-label">Откуда</span>
                <span class="order-value">Москва, ул. Лесная, 5</span>
            </div>
            <div class="order-row">
                <span class="order-label">Куда</span>
                <span class="order-value">СПб, ул. Кораблестроит., 21</span>
            </div>
            <div class="order-row">
                <span class="order-label">Стоимость</span>
                <span class="order-value">150 ₽ при получении</span>
            </div>
        </div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
        <a href="#" class="primary-btn">Показать QR-код</a>
        <a href="1-main.html" class="secondary-btn">Создать ещё заказ</a>
    </div>
</body>
</html>
