<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отлично!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #fff;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .phone-frame {
            max-width: 430px;
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 16px;
            display: flex;
            align-items: center;
        }

        .close-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .close-btn svg {
            width: 24px;
            height: 24px;
            stroke: #141414;
            stroke-width: 2;
            fill: none;
        }

        /* Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        /* Success Icon */
        .success-icon-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .outer-ring {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 3px solid #e8f5e9;
            background: transparent;
        }

        .success-circle {
            width: 120px;
            height: 120px;
            background: linear-gradient(180deg, #6fcf7c 0%, #4caf50 50%, #43a047 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.3);
        }

        .success-circle svg {
            width: 48px;
            height: 48px;
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .success-title {
            font-size: 28px;
            font-weight: 700;
            color: #141414;
            margin-bottom: 8px;
        }

        .success-subtitle {
            font-size: 17px;
            color: #8e8e93;
            line-height: 1.5;
        }

        /* Bottom Bar */
        .bottom-bar {
            padding: 16px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }

        .primary-btn {
            width: 100%;
            height: 56px;
            background: #141414;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .primary-btn:hover {
            background: #2d2d2d;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .phone-frame {
                max-width: 430px;
                margin: 20px auto;
                border-radius: 40px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.15);
                overflow: hidden;
                min-height: calc(100vh - 40px);
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Header -->
        <div class="header">
            <a href="1-main.html" class="close-btn">
                <svg viewBox="0 0 24 24">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </a>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="success-icon-container">
                <div class="outer-ring"></div>
                <div class="success-circle">
                    <svg viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
            </div>
            <div class="success-title">Отлично!</div>
            <div class="success-subtitle">Можно отправлять</div>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <a href="1-main.html" class="primary-btn">Закрыть</a>
        </div>
    </div>
</body>
</html>
