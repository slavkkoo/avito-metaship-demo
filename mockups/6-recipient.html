<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто получит посылку</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            color: #000;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Header */
        .header {
            padding: 8px 16px 24px;
        }

        .back-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
        }

        .page-subtitle {
            font-size: 15px;
            color: #8e8e93;
            line-height: 1.4;
        }

        /* Form */
        .form {
            padding: 24px 16px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-wrapper {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            font-size: 17px;
            color: #000;
            outline: none;
        }

        .input-field::placeholder {
            color: #8e8e93;
        }

        .input-field.filled {
            color: #000;
        }

        .clear-btn {
            width: 20px;
            height: 20px;
            background: #c7c7cc;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .clear-btn.visible {
            display: flex;
        }

        .clear-btn svg {
            width: 12px;
            height: 12px;
            fill: #fff;
        }

        .input-hint {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 8px;
            padding: 0 4px;
        }

        /* Submit Button */
        .submit-btn {
            margin: 24px 16px;
            width: calc(100% - 32px);
            padding: 16px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        /* Keyboard */
        .keyboard {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #d1d3d9;
            padding: 8px 4px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .keyboard-row:last-child {
            margin-bottom: 0;
        }

        .key {
            min-width: 32px;
            height: 42px;
            background: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 400;
            color: #000;
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        .key.wide {
            min-width: 42px;
            font-size: 16px;
        }

        .key.space {
            flex: 1;
            max-width: 180px;
            font-size: 16px;
        }

        .key.action {
            background: #a8abb3;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 4h2v8H1V4zm4-2h2v10H5V2zm4-2h2v12H9V0zm4 4h2v8h-2V4z" fill="#000"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2c2.7 0 5.2 1 7.1 2.7l-1.4 1.4c-1.5-1.3-3.5-2.1-5.7-2.1s-4.2.8-5.7 2.1L.9 4.7C2.8 3 5.3 2 8 2z" fill="#000"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="3" stroke="#000" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="18" height="6" rx="1.5" fill="#000"/></svg>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="5-map-to.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <h1 class="page-title">Кто получит посылку</h1>
        <p class="page-subtitle">Указывайте реальные данные — сотрудник на ПВЗ может проверить паспорт</p>
    </div>

    <!-- Form -->
    <div class="form">
        <div class="input-group">
            <div class="input-wrapper">
                <input type="text" class="input-field filled" placeholder="ФИО" value="Иванов Иван Иванович" id="fio">
                <div class="clear-btn visible" onclick="clearInput('fio')">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="tel" class="input-field filled" placeholder="Телефон" value="+7 (915) 123-45-67" id="phone">
                <div class="clear-btn visible" onclick="clearInput('phone')">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input type="email" class="input-field filled" placeholder="Электронная почта" value="petrov@mail.ru" id="email">
                <div class="clear-btn visible" onclick="clearInput('email')">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
            <p class="input-hint">Отправим ссылку на отслеживание заказа</p>
        </div>
    </div>

    <!-- Submit Button -->
    <a href="7-main-filled.html" class="submit-btn">Готово</a>

    <!-- Keyboard -->
    <div class="keyboard">
        <div class="keyboard-row">
            <div class="key">й</div>
            <div class="key">ц</div>
            <div class="key">у</div>
            <div class="key">к</div>
            <div class="key">е</div>
            <div class="key">н</div>
            <div class="key">г</div>
            <div class="key">ш</div>
            <div class="key">щ</div>
            <div class="key">з</div>
            <div class="key">х</div>
        </div>
        <div class="keyboard-row">
            <div class="key">ф</div>
            <div class="key">ы</div>
            <div class="key">в</div>
            <div class="key">а</div>
            <div class="key">п</div>
            <div class="key">р</div>
            <div class="key">о</div>
            <div class="key">л</div>
            <div class="key">д</div>
            <div class="key">ж</div>
            <div class="key">э</div>
        </div>
        <div class="keyboard-row">
            <div class="key shift action">
                <svg width="20" height="20" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z" fill="#000"/></svg>
            </div>
            <div class="key">я</div>
            <div class="key">ч</div>
            <div class="key">с</div>
            <div class="key">м</div>
            <div class="key">и</div>
            <div class="key">т</div>
            <div class="key">ь</div>
            <div class="key">б</div>
            <div class="key">ю</div>
            <div class="key wide action">⌫</div>
        </div>
        <div class="keyboard-row">
            <div class="key wide action">123</div>
            <div class="key wide action">😊</div>
            <div class="key space">Пробел</div>
            <a href="7-main-filled.html" class="key wide action" style="text-decoration: none; color: #000;">Ввод</a>
        </div>
    </div>

    <script>
        function clearInput(id) {
            const input = document.getElementById(id);
            input.value = '';
            input.classList.remove('filled');
            input.parentElement.querySelector('.clear-btn').classList.remove('visible');
        }

        document.querySelectorAll('.input-field').forEach(input => {
            input.addEventListener('input', function() {
                const clearBtn = this.parentElement.querySelector('.clear-btn');
                if (this.value) {
                    this.classList.add('filled');
                    clearBtn.classList.add('visible');
                } else {
                    this.classList.remove('filled');
                    clearBtn.classList.remove('visible');
                }
            });
        });
    </script>
</body>
</html>
