<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Откуда отправить</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            color: #000;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Header */
        .header {
            padding: 8px 16px 24px;
        }

        .back-btn {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .page-title {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
        }

        /* Input Field */
        .input-wrapper {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 16px;
        }

        .input-field {
            width: 100%;
            background: transparent;
            border: none;
            font-size: 17px;
            color: #000;
            outline: none;
        }

        .input-field::placeholder {
            color: #8e8e93;
        }

        /* Suggestions */
        .suggestions {
            padding: 16px 0;
        }

        .suggestion-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            cursor: pointer;
            text-decoration: none;
            color: #000;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: #f5f5f5;
        }

        .suggestion-icon {
            width: 40px;
            height: 40px;
            background: #f5f5f5;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suggestion-icon svg {
            width: 20px;
            height: 20px;
            fill: #8e8e93;
        }

        .suggestion-text {
            flex: 1;
        }

        .suggestion-main {
            font-size: 16px;
            font-weight: 500;
        }

        .suggestion-sub {
            font-size: 14px;
            color: #8e8e93;
            margin-top: 2px;
        }

        /* Keyboard (visual only) */
        .keyboard {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            background: #d1d3d9;
            padding: 8px 4px;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .keyboard-row:last-child {
            margin-bottom: 0;
        }

        .key {
            min-width: 32px;
            height: 42px;
            background: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 400;
            color: #000;
            box-shadow: 0 1px 0 rgba(0,0,0,0.3);
        }

        .key.wide {
            min-width: 42px;
            font-size: 16px;
        }

        .key.space {
            flex: 1;
            max-width: 180px;
            font-size: 16px;
        }

        .key.action {
            background: #a8abb3;
            font-size: 16px;
            font-weight: 500;
        }

        .key.shift {
            min-width: 42px;
        }

        .key.shift svg {
            width: 20px;
            height: 20px;
            fill: #000;
        }
    </style>
</head>
<body>
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><path d="M1 4h2v8H1V4zm4-2h2v10H5V2zm4-2h2v12H9V0zm4 4h2v8h-2V4z" fill="#000"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2c2.7 0 5.2 1 7.1 2.7l-1.4 1.4c-1.5-1.3-3.5-2.1-5.7-2.1s-4.2.8-5.7 2.1L.9 4.7C2.8 3 5.3 2 8 2z" fill="#000"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="3" stroke="#000" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#000"/><rect x="2" y="3" width="18" height="6" rx="1.5" fill="#000"/></svg>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="1-main.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <h1 class="page-title">Откуда отправить</h1>
        <div class="input-wrapper">
            <input type="text" class="input-field" placeholder="Введите адрес" id="addressInput" autofocus>
        </div>
    </div>

    <!-- Suggestions (shown when typing) -->
    <div class="suggestions" id="suggestions" style="display: none;">
        <a href="3-map-from.html" class="suggestion-item">
            <div class="suggestion-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="suggestion-text">
                <div class="suggestion-main">Москва, Тверская 5</div>
                <div class="suggestion-sub">Россия, Москва</div>
            </div>
        </a>
        <a href="3-map-from.html" class="suggestion-item">
            <div class="suggestion-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="suggestion-text">
                <div class="suggestion-main">Москва, ул. Лесная 5</div>
                <div class="suggestion-sub">Россия, Москва</div>
            </div>
        </a>
    </div>

    <!-- Keyboard -->
    <div class="keyboard">
        <div class="keyboard-row">
            <div class="key">й</div>
            <div class="key">ц</div>
            <div class="key">у</div>
            <div class="key">к</div>
            <div class="key">е</div>
            <div class="key">н</div>
            <div class="key">г</div>
            <div class="key">ш</div>
            <div class="key">щ</div>
            <div class="key">з</div>
            <div class="key">х</div>
        </div>
        <div class="keyboard-row">
            <div class="key">ф</div>
            <div class="key">ы</div>
            <div class="key">в</div>
            <div class="key">а</div>
            <div class="key">п</div>
            <div class="key">р</div>
            <div class="key">о</div>
            <div class="key">л</div>
            <div class="key">д</div>
            <div class="key">ж</div>
            <div class="key">э</div>
        </div>
        <div class="keyboard-row">
            <div class="key shift action">
                <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
            </div>
            <div class="key">я</div>
            <div class="key">ч</div>
            <div class="key">с</div>
            <div class="key">м</div>
            <div class="key">и</div>
            <div class="key">т</div>
            <div class="key">ь</div>
            <div class="key">б</div>
            <div class="key">ю</div>
            <div class="key wide action">⌫</div>
        </div>
        <div class="keyboard-row">
            <div class="key wide action">123</div>
            <div class="key wide action">😊</div>
            <div class="key space">Пробел</div>
            <a href="3-map-from.html" class="key wide action" style="text-decoration: none; color: #000;">Ввод</a>
        </div>
    </div>

    <script>
        const input = document.getElementById('addressInput');
        const suggestions = document.getElementById('suggestions');

        input.addEventListener('input', function() {
            if (this.value.length > 0) {
                suggestions.style.display = 'block';
            } else {
                suggestions.style.display = 'none';
            }
        });

        // Show suggestions after small delay for demo
        setTimeout(() => {
            input.value = 'Москва';
            suggestions.style.display = 'block';
        }, 500);
    </script>
</body>
</html>
