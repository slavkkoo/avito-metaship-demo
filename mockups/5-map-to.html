<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пункт получения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #e8e4df;
            min-height: 100vh;
            max-width: 430px;
            margin: 0 auto;
            color: #000;
            overflow: hidden;
        }

        /* Map Container */
        .map-container {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: #e5e3df;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect fill="%23e8e5e0" width="400" height="400"/><path d="M0 80h400M0 160h400M0 240h400M0 320h400" stroke="%23d4d1cc" stroke-width="1" fill="none"/><path d="M80 0v400M160 0v400M240 0v400M320 0v400" stroke="%23d4d1cc" stroke-width="1" fill="none"/><rect x="50" y="50" width="80" height="60" fill="%23c9c5c0" rx="2"/><rect x="180" y="100" width="100" height="80" fill="%23c9c5c0" rx="2"/><rect x="100" y="200" width="120" height="70" fill="%23c9c5c0" rx="2"/><rect x="270" y="180" width="90" height="100" fill="%23c9c5c0" rx="2"/><rect x="30" y="300" width="150" height="60" fill="%23c9c5c0" rx="2"/><path d="M0 150h150M200 150h200" stroke="%23fff" stroke-width="8"/><path d="M150 0v150M150 200v200" stroke="%23fff" stroke-width="8"/><path d="M0 280h120M180 280h220" stroke="%23fff" stroke-width="6"/><path d="M280 0v180M280 280v120" stroke="%23fff" stroke-width="6"/></svg>');
            background-size: cover;
        }

        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            padding: 50px 16px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            text-decoration: none;
        }

        .back-btn svg {
            width: 24px;
            height: 24px;
            fill: #000;
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #000;
        }

        .search-btn {
            width: 44px;
            height: 44px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .search-btn svg {
            width: 22px;
            height: 22px;
            fill: #000;
        }

        /* Map Markers */
        .marker {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px 8px 8px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 5;
        }

        .marker:hover {
            transform: scale(1.05);
        }

        .marker.selected {
            background: #000;
            color: #fff;
        }

        .marker-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 700;
            color: #fff;
        }

        .marker-logo.pochta {
            background: #003399;
        }

        .marker-info {
            display: flex;
            flex-direction: column;
        }

        .marker-name {
            font-size: 14px;
            font-weight: 600;
        }

        .marker-price {
            font-size: 12px;
            opacity: 0.7;
        }

        .marker.selected .marker-name,
        .marker.selected .marker-price {
            color: #fff;
        }

        /* Location Button */
        .location-btn {
            position: absolute;
            right: 16px;
            top: 45%;
            width: 44px;
            height: 44px;
            background: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 10;
        }

        .location-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* List Button */
        .list-btn {
            position: absolute;
            left: 16px;
            bottom: 380px;
            padding: 10px 16px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 10;
            font-size: 14px;
            font-weight: 500;
        }

        .list-btn svg {
            width: 16px;
            height: 16px;
            fill: #000;
        }

        /* Bottom Panel */
        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 20px 16px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 20;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        }

        /* PVZ Info */
        .pvz-info {
            margin-bottom: 16px;
        }

        .pvz-name {
            font-size: 20px;
            font-weight: 700;
            color: #000;
            margin-bottom: 4px;
        }

        .pvz-address {
            font-size: 15px;
            color: #000;
            margin-bottom: 4px;
        }

        .pvz-hours {
            font-size: 14px;
            color: #8e8e93;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: opacity 0.2s;
            margin-bottom: 12px;
        }

        .submit-btn:hover {
            opacity: 0.85;
        }

        /* Hint */
        .hint {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <!-- Map Container -->
    <div class="map-container">
        <!-- Markers -->
        <div class="marker selected" style="top: 45%; left: 40%;" onclick="selectMarker(this)">
            <div class="marker-logo pochta">
                <span style="font-size: 6px; line-height: 1;">ПОЧТА<br>РОССИИ</span>
            </div>
            <div class="marker-info">
                <span class="marker-name">Почта России</span>
                <span class="marker-price">49 ₽, 2-3 дня</span>
            </div>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <a href="4-sender.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </a>
        <span class="header-title">Пункт получения</span>
        <div class="search-btn">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </div>
    </div>

    <!-- Location Button -->
    <div class="location-btn">
        <svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
    </div>

    <!-- List Button -->
    <div class="list-btn">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        <span>Список</span>
    </div>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
        <div class="pvz-info">
            <div class="pvz-name">Почта России</div>
            <div class="pvz-address">Москва, ул. Лесная, 5</div>
            <div class="pvz-hours">Пн-пт: 8:00-21:00<br>Сб-вс: 9:00-18:00</div>
        </div>

        <a href="6-recipient.html" class="submit-btn">Отправить отсюда</a>

        <p class="hint">Показываем пункты той транспортной компании, которая была выбрала при отправке</p>
    </div>

    <script>
        function selectMarker(el) {
            document.querySelectorAll('.marker').forEach(m => m.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
